<fieldset [ngClass]="ngControl.control?.invalid && ngControl.control?.touched ? 'mb-0': 'mb-6'">
  <div class="flex items-center justify-between pb-2">
    <label class="label p-0 justify-start" [for]="id">
      <span class="label-text text-base-content font-medium text-sm transition-colors duration-200 dark:text-white">{{ label }}</span>
    </label>
    @if (allowCreate && !ngControl.control?.disabled) {
      <button type="button" class="btn btn-ghost btn-xs text-primary" (click)="toggleCreate()">
        <i class="fas" [ngClass]="showCreate() ? 'fa-times' : 'fa-plus'" aria-hidden="true"></i>
        {{ (showCreate() ? 'common.cancel' : 'financialInstitutions.addNew') | translate }}
      </button>
    }
  </div>
  <select
    [id]="id"
    [name]="name"
    [attr.aria-label]="label"
    [formControl]="$any(ngControl).control"
    class="px-3 py-2 shadow-sm border
      placeholder-slate-300
      disabled:bg-slate-50 disabled:text-slate-300 disabled:border-slate-200
      dark:disabled:bg-base-200 dark:disabled:text-base-content/40 dark:disabled:border-base-300
      focus:outline-none block w-full rounded-md sm:text-sm
      disabled:shadow-none"
    [ngClass]="{
      'border-red-500 focus:border-red-500 focus:ring-1 ring-red-500': ngControl.control?.invalid && ngControl.control?.touched,
      'focus:border-indigo-500 focus:ring-indigo-500 focus:ring-1': ngControl.control?.valid,
      'border-slate-300': ngControl.control && !ngControl.control.touched
    }"
  >
    <option [ngValue]="null" hidden>{{ "inputs.selectOption" | translate: { label: label } }}</option>
    @for (group of groups(); track group.type) {
      <optgroup [label]="FinancialInstitutionTypeLabels[group.type] | translate">
        @for (financialInstitution of group.financialInstitutions; track financialInstitution.id) {
          <option class="text-base-content" [ngValue]="financialInstitution.id">{{ getFinancialInstitutionLabel(financialInstitution) }}</option>
        }
      </optgroup>
    }
  </select>
  <app-form-errors [formControl]="$any(ngControl).control" [label]="label"/>
  @if (description) {
    <div class="mt-2">
      <span class="text-base-content/70 text-xs italic flex items-center gap-1 transition-colors duration-200 dark:text-gray-400">
        <i class="fas fa-info-circle text-info text-xs"></i>
        {{ description }}
      </span>
    </div>
  }

  @if (showCreate()) {
    <div class="mt-3 p-4 bg-base-100 border border-base-300 rounded-lg" [formGroup]="formGroup" (keydown.enter)="onCreateKeydown($event)">
      <h3 class="font-semibold text-base-content mb-3">{{ 'financialInstitutions.newTitle' | translate }}</h3>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <app-text
          formControlName="name"
          type="text"
          [label]="'financialInstitutions.name' | translate"
          [placeholder]="'financialInstitutions.namePlaceholder' | translate"
          [id]="id + 'NewName'"
          [name]="name + 'NewName'"
          [disabled]="creating()"
        />
        <app-select-input
          formControlName="type"
          [label]="'financialInstitutions.type' | translate"
          [id]="id + 'NewType'"
          [name]="name + 'NewType'"
          [list]="typeList()"
        />
      </div>
      <div class="flex justify-end">
        <button type="button" class="btn btn-primary btn-sm" (click)="save()" [disabled]="creating() || formGroup.invalid">
          @if (creating()) {
            <span class="loading loading-spinner loading-sm"></span>
          } @else {
            <i class="fas fa-save mr-1"></i>
          }
          {{ 'financialInstitutions.add' | translate }}
        </button>
      </div>
    </div>
  }
</fieldset>
