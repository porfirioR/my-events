@if (visible()) {
<dialog class="modal modal-open">
  <div class="modal-box">
    <h3 class="font-bold text-lg mb-4">
      {{ (movementType() === MovementType.Withdrawal ? 'savingsGoalDetail.withdrawTitle' : 'savingsGoalDetail.contributeTitle') | translate }}
    </h3>

    <form [formGroup]="form" (submit)="submit()">
      <app-text
        formControlName="amount"
        type="number"
        [label]="'savingsGoalDetail.amount' | translate"
        id="mutualFundAmount"
        name="Amount"
        [description]="movementType() === MovementType.Withdrawal
          ? ('savingsGoalDetail.availableBalance' | translate: { amount: formatCurrency(maxWithdrawal(), currencyId()) })
          : ''"
      />

      <app-date-input
        formControlName="date"
        [label]="'savingsGoalDetail.movementDate' | translate"
        id="mutualFundDate"
        name="date"
      />

      <app-text-area-input
        formControlName="description"
        [label]="'savingsGoalDetail.descriptionOptional' | translate"
        [placeholder]="'savingsGoalDetail.addNote' | translate"
        id="mutualFundDescription"
        name="description"
      />

      <div class="modal-action">
        <button type="button" class="btn btn-outline btn-primary flex items-center gap-2 transition-all duration-200 hover:scale-105" (click)="close()">
          {{ 'savingsGoalDetail.cancel' | translate }}
        </button>

        @if (isSubmitting()) {
          <button type="button" class="btn btn-primary flex items-center gap-2 loading-btn">
            <span class="loading loading-spinner loading-xs"></span>
            {{ 'savingsGoalDetail.saving' | translate }}
          </button>
        } @else {
          <button role="button" type="submit"
            class="btn btn-primary flex items-center gap-2 transition-all duration-200 hover:scale-105"
            [disabled]="form.invalid || isSubmitting()" [class.btn-disabled]="form.invalid || isSubmitting()">
            <i class="fas fa-hand-holding-dollar text-sm"></i>
            {{ (movementType() === MovementType.Withdrawal ? 'savingsGoalDetail.withdrawButton' : 'savingsGoalDetail.contributeButton') | translate }}
          </button>
        }
      </div>
    </form>
  </div>
  <div class="modal-backdrop" (click)="close()"></div>
</dialog>
}
