<div class="form-control w-full">
  <p class="text-sm font-medium text-base-content mb-2">
    {{ label() | translate }}
    @if (required()) {
      <span class="text-error ml-1">*</span>
    }
  </p>

  <!-- Chips compactos: la elegida queda marcada con su color (volver a tocarla la quita) -->
  <div class="flex flex-wrap gap-2" role="radiogroup">
    @for (category of activeCategories(); track category.id) {
      <button
        type="button"
        role="radio"
        class="btn btn-sm rounded-full gap-1.5 font-normal border transition-colors duration-200"
        [class.btn-ghost]="!isSelected(category)"
        [class.border-base-300]="!isSelected(category)"
        [class.font-semibold]="isSelected(category)"
        [style.border-color]="isSelected(category) ? category.color : null"
        [style.background-color]="isSelected(category) ? category.color + '26' : null"
        [attr.aria-checked]="isSelected(category)"
        (click)="selectCategory(category)"
        [disabled]="disabled()"
      >
        <span aria-hidden="true">{{ category.icon }}</span>
        {{ 'categories.' + category.name | translate }}
        @if (isSelected(category)) {
          <i class="fas fa-check text-xs" aria-hidden="true"></i>
        }
      </button>
    }
  </div>
</div>
