<fieldset class="form-control" [class.mb-4]="!compact">
  <label class="label cursor-pointer justify-start gap-2">
    <input
      type="checkbox"
      [formControl]="$any(ngControl).control"
      class="checkbox checkbox-primary"
    />
    <span class="label-text">{{label}}</span> 
  </label>
</fieldset>
