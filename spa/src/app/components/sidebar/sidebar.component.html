<!-- Fondo oscuro del cajón en móvil -->
@if (isMobileOpen()) {
  <div class="fixed inset-0 top-16 z-40 bg-black/40 lg:hidden" (click)="layoutService.closeMobileSidebar()" aria-hidden="true"></div>
}

<aside
  class="fixed top-16 bottom-0 left-0 z-40 flex flex-col bg-base-100 border-r border-base-300/60 transition-all duration-300 w-64 lg:translate-x-0"
  [class.-translate-x-full]="!isMobileOpen()"
  [class.lg:w-20]="isCollapsed()"
  [attr.aria-label]="'common.navigation' | translate">

  <nav class="flex-1 py-4 px-3" [class.overflow-y-auto]="!isCollapsed()">
    <ul class="flex flex-col gap-1">
      @for (item of items; track item.route) {
        <li [class.lg:tooltip]="isCollapsed()" [class.lg:tooltip-right]="isCollapsed()" [attr.data-tip]="isCollapsed() ? (item.label | translate) : null">
          <a [routerLink]="item.route"
            routerLinkActive="bg-primary/10 text-primary font-semibold"
            [routerLinkActiveOptions]="{ exact: item.exact }"
            class="flex items-center gap-3 h-11 px-3 rounded-xl text-base-content/80 hover:bg-base-200 dark:hover:bg-base-300 hover:text-base-content transition-colors duration-200"
            [class.lg:justify-center]="isCollapsed()"
            [class.lg:px-0]="isCollapsed()">
            <i class="fas {{ item.icon }} w-5 text-center text-base" aria-hidden="true"></i>
            <span class="truncate" [class.lg:hidden]="isCollapsed()">{{ item.label | translate }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>

  <!-- Colapsar / expandir (solo escritorio) -->
  <div class="hidden lg:block p-3 border-t border-base-300/60">
    <button type="button" (click)="layoutService.toggleSidebar()"
      class="w-full flex items-center gap-3 h-10 px-3 rounded-xl text-sm text-base-content/60 hover:bg-base-200 dark:hover:bg-base-300 hover:text-base-content transition-colors duration-200"
      [class.justify-center]="isCollapsed()"
      [class.px-0]="isCollapsed()"
      [attr.aria-label]="(isCollapsed() ? 'common.expandMenu' : 'common.collapseMenu') | translate">
      <i class="fas w-5 text-center" [class.fa-angles-left]="!isCollapsed()" [class.fa-angles-right]="isCollapsed()" aria-hidden="true"></i>
      @if (!isCollapsed()) {
        <span>{{ 'common.collapseMenu' | translate }}</span>
      }
    </button>
  </div>
</aside>
