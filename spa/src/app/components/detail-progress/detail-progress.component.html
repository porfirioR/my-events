<div class="bg-base-100 rounded-xl border border-base-300/60 shadow-sm p-4">
  <div class="flex justify-between items-center text-sm mb-2">
    <span class="font-medium text-base-content">{{ 'common.progress' | translate }}</span>
    <span class="text-xl font-bold" [ngClass]="textClass()">{{ percent() }}%</span>
  </div>
  <progress class="progress w-full h-3" [ngClass]="progressClass()" [value]="value()" [max]="max() || 1"></progress>
  @if (leftText() || rightText()) {
    <div class="flex justify-between gap-4 text-xs text-base-content/60 mt-1">
      <span>{{ leftText() }}</span>
      <span class="text-right">{{ rightText() }}</span>
    </div>
  }
</div>
