<header class="navbar bg-primary text-primary-content shadow-lg fixed top-0 left-0 right-0 z-50 transition-colors duration-300">
  @if (isAuthenticated()) {
    <article class="navbar-start w-auto flex items-center gap-1">
      <!-- Móvil: abre el cajón. Escritorio: colapsa/expande la barra lateral -->
      <button type="button" class="btn btn-ghost btn-square hover:bg-primary-focus transition-colors duration-200"
        (click)="layoutService.toggleSidebar()"
        [attr.aria-label]="(isSidebarCollapsed() ? 'common.expandMenu' : 'common.collapseMenu') | translate">
        <i class="fas fa-bars text-xl" aria-hidden="true"></i>
      </button>
      <a routerLink="/" class="px-1 text-lg font-bold tracking-tight whitespace-nowrap">
        {{ 'auth.appName' | translate }}
      </a>
    </article>
    <article class="navbar-end ml-auto">
      <app-language-selector/>
      <!-- Tema claro/oscuro -->
      <button type="button" class="btn btn-ghost btn-circle hover:bg-primary-focus transition-colors duration-200"
        (click)="toggleTheme()"
        [attr.aria-label]="(currentTheme == 'light' ? 'common.darkMode' : 'common.lightMode') | translate"
        [attr.title]="(currentTheme == 'light' ? 'common.darkMode' : 'common.lightMode') | translate">
        <i class="fas text-xl" [class.fa-moon]="currentTheme == 'light'" [class.fa-sun]="currentTheme == 'dark'" aria-hidden="true"></i>
      </button>
      <!-- User Profile -->
      <div class="dropdown dropdown-end">
        <div tabindex="0" role="button" class="btn btn-ghost btn-circle flex items-center justify-center">
          <div class="w-10 rounded-full">
            <i class="fas fa-user-circle text-2xl"></i>
          </div>
        </div>
        <ul tabindex="0" class="dropdown-content z-[1] menu p-2 shadow bg-base-100 text-base-content rounded-box w-52">
          <li>
            <div class="flex flex-col items-start p-2">
              <span class="font-bold truncate">{{currentUserName()}}</span>
            </div>
          </li>
          <div class=" my-0"></div>
          <li>
            <a class="hover:bg-primary hover:text-primary-content transition-colors duration-200 rounded-lg" (click)="openProfile()">
              <i class="fas fa-user mr-2"></i>
              {{ 'common.profile' | translate }}
            </a>
          </li>
          <li class="hidden">
            <a class="hover:bg-primary hover:text-primary-content transition-colors duration-200 rounded-lg">
              <i class="fas fa-cog mr-2"></i>Settings
            </a>
          </li>
          <div class="divider my-1"></div>
          <li>
            <a class="hover:bg-error hover:text-error-content transition-colors duration-200 rounded-lg" (click)="logOut()">
              <i class="fas fa-sign-out-alt mr-2"></i>
              {{ 'auth.logout' | translate }}
            </a>
          </li>
        </ul>
      </div>
    </article>
  }
</header>
<app-profile />
