<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Mis Eventos</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Tu patrimonio, ahorros, préstamos y gastos compartidos en un solo lugar.">
  <link rel="canonical" href="https://kind-coast-0bf3d7c10.4.azurestaticapps.net/">

  <!-- Íconos: SVG para navegadores modernos, .ico de respaldo, apple-touch para iOS -->
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#4338CA">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-title" content="Mis Eventos">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Vista previa al compartir el link (WhatsApp, Facebook, Telegram...): URLs absolutas -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://kind-coast-0bf3d7c10.4.azurestaticapps.net/">
  <meta property="og:site_name" content="Mis Eventos">
  <meta property="og:title" content="Mis Eventos">
  <meta property="og:description" content="Tu patrimonio, ahorros, préstamos y gastos compartidos en un solo lugar.">
  <meta property="og:locale" content="es_PY">
  <meta property="og:image" content="https://kind-coast-0bf3d7c10.4.azurestaticapps.net/assets/img/og-image.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Ícono de Mis Eventos: un calendario con barras y una línea que crecen">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Mis Eventos">
  <meta name="twitter:description" content="Tu patrimonio, ahorros, préstamos y gastos compartidos en un solo lugar.">
  <meta name="twitter:image" content="https://kind-coast-0bf3d7c10.4.azurestaticapps.net/assets/img/og-image.png">

  <!-- Pantalla de inicio: va inline para que se pinte antes de que cargue el CSS de la app -->
  <style>
    #app-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #3730A3;
      transition: opacity 300ms ease;
    }
    #app-splash.app-splash-hide {
      opacity: 0;
      pointer-events: none;
    }
    #app-splash img {
      width: 112px;
      height: 112px;
      border-radius: 26px;
      box-shadow: 0 12px 32px rgb(0 0 0 / 0.25);
    }
    #app-splash p {
      margin: 0;
      color: #ffffff;
      font: 600 22px/1.2 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      letter-spacing: 0.01em;
    }
    #app-splash .app-splash-loader {
      width: 28px;
      height: 28px;
      margin-top: 8px;
      border: 3px solid rgb(255 255 255 / 0.25);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: app-splash-spin 800ms linear infinite;
    }
    @keyframes app-splash-spin {
      to { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      #app-splash .app-splash-loader { animation-duration: 2400ms; }
    }
  </style>
</head>
<body>
  <div id="app-splash" role="status" aria-label="Cargando Mis Eventos">
    <img src="assets/img/icon.svg" alt="">
    <p>Mis Eventos</p>
    <span class="app-splash-loader"></span>
  </div>
  <app-root></app-root>
</body>
</html>
